[package]
name    = "hexai-gui"
version = "2.0.0"
edition = "2021"

[lib]
name             = "hexai_gui_lib"
crate-type       = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hexai-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http  = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
