[package]
name = "hexai-desktop"
version = "0.1.0"
description = "HexAi – AI assistant for HackerOS"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["api-all", "system-tray", "window-set-title", "window-set-size", "window-close", "window-start-dragging", "shell-open", "http-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Opcjonalnie: jeśli chcesz uruchamiać procesy potomne
# (np. aby automatycznie startować backend Python)
# odkomentuj poniższą linię:
# duct = "0.13"

[profile.release]
opt-level = 3
lto = true
