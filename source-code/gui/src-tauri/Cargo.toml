[package]
name = "hexai-desktop"
version = "0.1.0"
description = "HexAi – AI assistant for HackerOS"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }                     # no explicit features
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
